<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070d" />
      <stop offset="45%" stop-color="#080c16" />
      <stop offset="85%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <radialGradient id="auroraGlow" cx="68%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#0369a1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#05070d" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ribbonDark1" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="30%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="ribbonDark2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="ribbonNeonEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="ribbonDark3" x1="100%" y1="20%" x2="0%" y2="80%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="30%" stop-color="#1e3a8a" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="ribbonDark4" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e3a8a" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <filter id="darkSoftBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="darkDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-18" dy="30" stdDeviation="28" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="darkGentleFold" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="-12" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGradDark)" />
  <rect width="1920" height="1080" fill="url(#auroraGlow)" />

  <g opacity="0.4" filter="url(#darkSoftBlur)">
    <path d="M-100,500 C200,200 500,800 800,400 C1100,100 1400,600 1700,300 C1850,150 2000,250 2100,200 L2100,1200 L-100,1200 Z" fill="url(#ribbonDark2)" />
  </g>

  <g filter="url(#darkDropShadow)">
    <path d="M1100,-80 C1250,80 1420,240 1520,380 C1620,520 1660,700 1540,820 C1430,930 1260,940 1140,860 C1010,770 980,590 1060,450 C1140,310 1310,210 1440,110 L1600,-80 Z" fill="url(#ribbonDark3)" opacity="0.9" />
  </g>

  <path d="M1240,40 C1340,170 1480,310 1550,430 C1620,550 1630,680 1530,760 C1430,840 1310,830 1210,760 C1120,690 1100,550 1170,440 C1240,330 1380,240 1480,140 Z" fill="none" stroke="url(#ribbonNeonEdge)" stroke-width="4.5" opacity="0.85" />

  <g filter="url(#darkDropShadow)">
    <path d="M-120,420 C100,340 320,440 460,580 C600,720 620,910 500,1040 C410,1130 260,1160 120,1120 C-30,1080 -120,950 -140,800 Z" fill="url(#ribbonDark2)" opacity="0.95" />
    <path d="M-40,440 C160,370 340,470 450,590 C560,710 570,870 460,980" fill="none" stroke="url(#ribbonNeonEdge)" stroke-width="5" opacity="0.9" />
  </g>

  <g filter="url(#darkGentleFold)">
    <path d="M520,1120 C640,960 780,820 950,720 C1120,620 1320,580 1500,640 C1680,700 1820,840 1960,980 L1960,1150 L500,1150 Z" fill="url(#ribbonDark4)" opacity="0.85" />
    <path d="M530,1100 C650,940 790,810 960,710 C1130,610 1320,575 1490,630" fill="none" stroke="url(#ribbonNeonEdge)" stroke-width="4" opacity="0.8" />
  </g>

  <g filter="url(#darkDropShadow)">
    <path d="M1350,-100 C1480,50 1650,180 1780,310 C1910,440 2000,600 1960,750 C1920,900 1780,990 1620,980 C1460,970 1340,860 1310,710 C1280,560 1360,420 1480,290 C1590,170 1730,70 1840,-60 Z" fill="url(#ribbonDark1)" opacity="0.92" />
    <path d="M1420,-40 C1540,90 1690,210 1810,330 C1920,440 1980,580 1940,700" fill="none" stroke="url(#ribbonNeonEdge)" stroke-width="5.5" opacity="0.9" />
  </g>

  <g filter="url(#darkGentleFold)">
    <path d="M-80,180 C120,80 340,110 520,210 C700,310 810,480 800,660 C790,820 680,950 520,990 C360,1030 200,960 90,840 C-20,720 -60,560 -80,390 Z" fill="url(#ribbonDark2)" opacity="0.88" />
    <path d="M-40,190 C140,100 340,130 500,220 C660,310 760,460 760,620" fill="none" stroke="url(#ribbonNeonEdge)" stroke-width="4.5" opacity="0.85" />
  </g>

  <radialGradient id="centerDarkScrim" cx="50%" cy="46%" r="55%">
    <stop offset="0%" stop-color="#05070d" stop-opacity="0.38" />
    <stop offset="60%" stop-color="#05070d" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#05070d" stop-opacity="0" />
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#centerDarkScrim)" />
</svg>